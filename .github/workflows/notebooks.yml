# Every push and PR checks the repo's layout and catalog (ci/check_layout.py).
# It reports; nothing is gated on it.
name: Notebooks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv run --no-project --with "pyyaml>=6,<7" python ci/check_layout.py
